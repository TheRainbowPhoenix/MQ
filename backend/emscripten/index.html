<!doctype html>

<html>
  <head>
    <title>MQ emulator</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <style>
      body {
        background: #424748;
      }
      canvas, textarea {
        box-sizing: border-box;
        display: block;
      }
      canvas {
        margin: 0 auto;
      }
      textarea {
        width: 1366px; margin: 8px auto; background: black; color: white;
        padding: 2px 4px; border-radius: 2px;
        border: 1px solid rgba(255, 255, 255, .5); }
      textarea:focus {
        border-color: rgba(128, 192, 255, .8);
        outline: none;
      }
    </style>
  </head>

  <body>
    <!-- Elements used by the emscripten .js script -->
    <div class="spinner" id="spinner" style="display: none;"></div>
    <div class="emscripten" id="status"></div>
    <div class="emscripten">
      <progress id="progress" max="0" value="0" hidden=""></progress>
    </div>

    <span id="controls" style="display: none">
      <span><input type="checkbox" id="resize">Resize canvas</span>
      <span><input type="checkbox" id="pointerLock" checked="">Lock/hide mouse pointer</span>
      <span><input type="button" onclick="Module.requestFullscreen(document.getElementById(&quot;pointerLock&quot;).checked,document.getElementById(&quot;resize&quot;).checked)" value="Fullscreen"></span>
    </span>

    <div><canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="1366" height="768" style="cursor: default;"></canvas></div>
    <textarea id="output" rows="8"
      autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

    <script>var statusElement=document.getElementById("status"),progressElement=document.getElementById("progress"),spinnerElement=document.getElementById("spinner"),Module={preRun:[],postRun:[],print:function(){var e=document.getElementById("output");return e&&(e.value=""),function(t){arguments.length>1&&(t=Array.prototype.slice.call(arguments).join(" ")),console.log(t),e&&(e.value+=t+"\n",e.scrollTop=e.scrollHeight)}}(),printErr:function(e){arguments.length>1&&(e=Array.prototype.slice.call(arguments).join(" ")),console.error(e)},canvas:function(){var e=document.getElementById("canvas");return e.addEventListener("webglcontextlost",(function(e){alert("WebGL context lost. You will need to reload the page."),e.preventDefault()}),!1),e}(),setStatus:function(e){if(Module.setStatus.last||(Module.setStatus.last={time:Date.now(),text:""}),e!==Module.setStatus.last.text){var t=e.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/),n=Date.now();t&&n-Module.setStatus.last.time<30||(Module.setStatus.last.time=n,Module.setStatus.last.text=e,t?(e=t[1],progressElement.value=100*parseInt(t[2]),progressElement.max=100*parseInt(t[4]),progressElement.hidden=!1,spinnerElement.hidden=!1):(progressElement.value=null,progressElement.max=null,progressElement.hidden=!0,e||(spinnerElement.style.display="none")),statusElement.innerHTML=e)}},totalDependencies:0,monitorRunDependencies:function(e){this.totalDependencies=Math.max(this.totalDependencies,e),Module.setStatus(e?"Preparing... ("+(this.totalDependencies-e)+"/"+this.totalDependencies+")":"All downloads complete.")}};Module.setStatus("Downloading..."),window.onerror=function(e){Module.setStatus("Exception thrown, see JavaScript console"),spinnerElement.style.display="none",Module.setStatus=function(e){e&&Module.printErr("[post-exception status] "+e)}}</script>
    <script async="" src="mq.js"></script>
  </body>
</html>
