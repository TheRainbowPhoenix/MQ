name: Windows MinGW Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          make
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-glm
          mingw-w64-x86_64-glew
          mingw-w64-x86_64-vulkan-loader
          mingw-w64-x86_64-ffmpeg
          nasm
          sed

    - name: Build Azur
      run: |
        git clone --recursive https://git.planet-casio.com/Lephenixnoir/Azur.git
        cd Azur

        # Patch Azur/3rdparty/CMakeLists.txt to use opengl32 directly on Windows
        sed -i 's/pkg_check_modules(glx REQUIRED glx IMPORTED_TARGET)/# pkg_check_modules(glx REQUIRED glx IMPORTED_TARGET)/' 3rdparty/CMakeLists.txt
        sed -i 's/pkg_check_modules(opengl REQUIRED opengl IMPORTED_TARGET)/# pkg_check_modules(opengl REQUIRED opengl IMPORTED_TARGET)/' 3rdparty/CMakeLists.txt
        sed -i 's/target_link_libraries(gl3w PUBLIC PkgConfig::glx PkgConfig::opengl -ldl)/target_link_libraries(gl3w PUBLIC opengl32)/' 3rdparty/CMakeLists.txt

        # Build and install 3rdparty libraries first
        cmake -B build-3rdparty -S 3rdparty -G Ninja -DCMAKE_INSTALL_PREFIX=$HOME/.local -DAZUR_PLATFORM=linux
        cmake --build build-3rdparty
        cmake --install build-3rdparty

        # Patch Azur/CMakeLists.txt to use opengl32 directly on Windows
        sed -i 's/pkg_check_modules(glx REQUIRED glx IMPORTED_TARGET)/# pkg_check_modules(glx REQUIRED glx IMPORTED_TARGET)/' CMakeLists.txt
        sed -i 's/pkg_check_modules(opengl REQUIRED opengl IMPORTED_TARGET)/# pkg_check_modules(opengl REQUIRED opengl IMPORTED_TARGET)/' CMakeLists.txt
        sed -i 's/link_libraries(PkgConfig::sdl2 PkgConfig::opengl -lm)/link_libraries(PkgConfig::sdl2 opengl32)/' CMakeLists.txt

        # Build and install Azur
        export AZUR_PATH_linux="$HOME/.local"
        cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=$HOME/.local -DAZUR_PLATFORM=linux
        cmake --build build
        cmake --install build

    - name: Build MQ
      run: |
        export AZUR_PATH_linux="$HOME/.local"
        cmake -B build-mingw -G Ninja -DAZUR_PLATFORM=linux -DCMAKE_BUILD_TYPE=Release
        cmake --build build-mingw

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mq-windows
        path: build-mingw/mq.exe
