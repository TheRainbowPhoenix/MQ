name: Build MQ
on:
  push:
    tags:
      - v0.*.*
jobs:
  integrity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
          python -m venv .venv
          source ./.venv/bin/activate
          pip install -r ./scripts/requirements.txt
      - name: Test
        run: |
          echo 'toutou' > ./text1.txt
          echo 'salut' > ./text2.txt
          zip /tmp/text.zip ./text1.txt ./text2.txt
          ls -l /tmp
          cd /tmp
          unzip text.zip

  linux_build:
    runs-on: ubuntu-latest
    needs: integrity_check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            python3 \
            shellcheck \
            libsdl2-dev \
            libsdl2-image-dev \
            libopengl-dev \
            libswscale-dev \
            libavutil-dev \
            libavformat-dev \
            libavcodec-dev
          python -m venv .venv
          source ./.venv/bin/activate
          pip install -r ./scripts/requirements.txt
      - name: Setup env
        run: |
          tag_name="$(echo ${{ github.ref_name }})"
          version="$(echo $tag_name | grep -Eo '[0-9]+.[0-9]+.[0-9]+$')"
          echo "version=${version}" >> $GITHUB_ENV
      - name: Build all
        run: |
          source ./.venv/bin/activate
          ./.ci/check-integrity.sh "${{ env.version }}"
          ./.ci/build-linux.sh "${{ env.version }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mq-linux
          path: ./build/mq-linux*
          if-no-files-found: error
          retention-days: 1

