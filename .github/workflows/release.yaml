  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v6
  #     - name: Setup dependencies
  #       run: |
  #         brew install -f --quiet \
  #           python \
  #           shellcheck \
  #           sdl2 sdl2_image \
  #           glfw3 glew \
  #           ffmpeg
  #         python -m venv .venv
  #         source ./.venv/bin/activate
  #         pip install -r ./scripts/requirements.txt
  #     - name: Setup Env
  #       run: |
  #         tag_name="$(echo ${{ github.ref_name }})"
  #         version="$(echo $tag_name | grep -Eo '[0-9]+.[0-9]+.[0-9]+$')"
  #         echo "version=${version}" >> $GITHUB_ENV
  #     - name: Build all
  #       run: |
  #         source ./.venv/bin/activate
  #         ./.ci/check-integrity.sh "${{ env.version }}"
  #         ./.ci/build-macos.sh "${{ env.version }}"

  generate_release:
    runs-on: ubuntu-latest
    needs:
      - linux_build
      # - macos_build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3
          version: 1.0
      - name: Setup Env
        run: |
          tag_name="$(echo ${{ github.ref_name }})"
          mq_version="$(echo $tag_name | grep -Eo '[0-9]+.[0-9]+.[0-9]+$')"
          echo "mq_version=${mq_version}" >> $GITHUB_ENV
          echo "date_info=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          python -m venv .venv
          source ./.venv/bin/activate
          pip install -r ./scripts/requirements.txt
          source ./.venv/bin/activate
      - name: Generate changelog information
        run: |
          ./.ci/gen-changelog.sh "${{ env.mq_version }}"
      - name: Fetch linux artifacts
        uses: actions/download-artifact@v6
        with:
          name: mq-linux
          path: ./build/
      - name: 'Create the release'
        uses: softprops/action-gh-release@v2
        with:
          name: '${{ env.mq_version }} (${{ env.date_info }})'
          body_path: './build/changelog.md'
          files: ./build/mq-*
          prerelease: true
          make_latest: true
