name: Build MQ
on:
  push:
    tags:
      - v0.*.*
jobs:
  integrity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: |
            python3
            shellcheck
          version: 1.0
      # todo: move me
      - name: Setup env
        run: |
          tag_name="$(echo ${{ github.ref_name }})"
          mq_version="$(echo $tag_name | grep -Eo '[0-9]+.[0-9]+.[0-9]+$')"
          echo "mq_version=${mq_version}" >> $GITHUB_ENV
          python -m venv .venv
          source ./.venv/bin/activate
          pip install -r ./scripts/requirements.txt
      - name: Check integrity
        run: |
          ./.ci/check-integrity.sh "${{ env.mq_version }}"

  linux_build:
    runs-on: ubuntu-latest
    needs: integrity_check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: |
            cmake
            python3
            shellcheck
            libsdl2-dev
            libsdl2-image-dev
            libopengl-dev
            libswscale-dev
            libavutil-dev
            libavformat-dev
            libavcodec-dev
            nasm
            libx264-dev
            libx265-dev
          version: 1.0
      - name: Setup env
        run: |
          tag_name="$(echo ${{ github.ref_name }})"
          mq_version="$(echo $tag_name | grep -Eo '[0-9]+.[0-9]+.[0-9]+$')"
          echo "mq_version=${mq_version}" >> $GITHUB_ENV
          python -m venv .venv
          source ./.venv/bin/activate
          pip install -r ./scripts/requirements.txt
      - name: Build all
        run: |
          ./.ci/build-linux.sh "${{ env.mq_version }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mq-linux
          path: ./build/mq-linux*
          if-no-files-found: error
          retention-days: 1

  # macos_build:
