name: Build MQ
on:
  push:
    tags:
      - v0.*.*

jobs:
  integrity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check integrity
        uses: ./.github/actions/mq-env-exec
        with:
          dependencies: |
            python3
            shellcheck
          commands: |
            ./.ci/check-integrity.sh {MQ_VER}

  linux_build:
    runs-on: ubuntu-latest
    needs: integrity_check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Checkout Submodules
        uses: ./.github/actions/mq-submodule-sync
      - name: Build all (linux)
        uses: ./.github/actions/mq-env-exec
        with:
          dependencies: |
            cmake
            python3
            shellcheck
            libsdl2-dev
            libsdl2-image-dev
            libopengl-dev
            nasm
          commands: |
            ./.ci/build-linux.sh {MQ_VER}
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mq-linux
          path: ./build/mq-linux*
          if-no-files-found: error
          retention-days: 1

  generate_release:
    runs-on: ubuntu-latest
    needs:
      - linux_build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Generate changelog information
        uses: ./.github/actions/mq-env-exec
        id: gen-changelog
        with:
          dependencies: python3
          commands: ./.ci/gen-changelog.sh {MQ_VER}
      - name: Fetch linux artifacts
        uses: actions/download-artifact@v6
        with:
          name: mq-linux
          path: ./build/
      - name: 'Create the release'
        uses: softprops/action-gh-release@v2
        with:
          name: '${{ env.mq_version }} (${{ env.mq_dateinfo }})'
          body_path: './build/changelog.md'
          files: ./build/mq-*
          make_latest: true
        env:
          mq_version: ${{ steps.gen-changelog.outputs.mq-version }}
          mq_dateinfo: ${{ steps.gen-changelog.outputs.mq-dateinfo }}
