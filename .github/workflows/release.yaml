  generate_release:
    runs-on: ubuntu-latest
    needs:
      - linux_build
      # - macos_build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Env
        run: |
          tag_name="$(echo ${{ github.ref_name }})"
          version="$(echo $tag_name | grep -Eo '[0-9]+.[0-9]+.[0-9]+$')"
          echo "version=${version}" >> $GITHUB_ENV
          echo "date_info=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Generate changelog information
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
          python -m venv .venv
          source ./.venv/bin/activate
          pip install -r ./scripts/requirements.txt
          source ./.venv/bin/activate
          ./.ci/gen-changelog.sh "${{ env.version }}"
      - name: Fetch linux artifacts
        uses: actions/download-artifact@v6
        with:
          name: mq-linux
          path: ./build/
      - name: 'Create the release'
        uses: softprops/action-gh-release@v2
        with:
          name: '${{ env.version }} (${{ env.date_info }})'
          body_path: './build/changelog.md'
          files: ./build/mq-*
          prerelease: true
          make_latest: true
